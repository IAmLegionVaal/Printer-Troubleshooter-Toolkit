name: PowerShell Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -ErrorAction Stop
      - name: Report warnings and enforce errors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -ErrorAction Stop
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error)
          if ($findings.Count -gt 0) {
            $findings | Sort-Object ScriptName, Line, RuleName | Format-Table RuleName, Severity, ScriptName, Line, Message -Wrap
          }
          $errors = @($findings | Where-Object Severity -eq 'Error')
          $warnings = @($findings | Where-Object Severity -eq 'Warning')
          @(
            '## PSScriptAnalyzer'
            "Errors: $($errors.Count)"
            "Warnings requiring backlog triage: $($warnings.Count)"
            'Warnings are reported but not release-blocking while legacy menu-style code is refactored.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($errors.Count -gt 0) {
            throw 'PSScriptAnalyzer found Error-severity issues.'
          }
